name: RAG Quality Gate CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  eval-quality:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v3

    - name: 设置 Python 3.11 环境
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: 安装项目依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行 DeepEval RAG 质量评估测试
      env:
        # 从 GitHub Secrets 中安全读取 API Key 与 Endpoint
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      run: |
        deepeval test run tests/test_rag_quality.py